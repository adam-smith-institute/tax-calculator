name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Engine, golden master, worked examples, parameters, pipeline
        run: npm test
      - name: Browser tests (numbers end to end, accessibility, layout, embed)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
