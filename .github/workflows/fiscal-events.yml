name: Check for new fiscal events

# Weekly: looks on GOV.UK for a Budget, Spring or Autumn Statement, or OOTLAR newer than the
# tax parameters' sources, and opens an issue if it finds one. It never changes rates.
on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: node scripts/check-fiscal-events.mjs --issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
